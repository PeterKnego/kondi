[workspace]
# crates/gui is a Tauri app managed separately — see crates/gui/README.md
members = [
    "crates/core",
    "crates/mcp-server",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
scopeguard = { version = "1" }
rmcp = { version = "0.16", features = [
    "client",
    "server",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
rquickjs = { version = "0.11", features = ["full-async", "parallel"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"
oxc = { version = "0.114", features = ["semantic", "transformer", "codegen"] }
http = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
